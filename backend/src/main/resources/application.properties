server.port=8080

# Conexión a Oracle Database Free (Contenedor oracle-clase7)
spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/FREEPDB1
spring.datasource.username=clase7
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Configuración de migraciones Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JPA / Hibernate: solo valida el esquema gestionado por Flyway
spring.jpa.hibernate.ddl-auto=validate

# Keycloak como Authorization Server: firma (JWKS), vigencia, issuer y audiencia
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/realms/utn-clase9
spring.security.oauth2.resourceserver.jwt.audiences=clientes-api